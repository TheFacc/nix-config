# SOPS rules for secrets/secrets.yaml
#
# Replace the age1… placeholders below with the **public** keys from each host’s
# /var/lib/sops-nix/keys.txt (line starting with age1…) after the first boot
# that created them, OR paste pubkeys you generated with age-keygen.
#
# Every machine that should decrypt this file must have its age **public** key
# listed here. Re-run `sops updatekeys secrets/secrets.yaml` after you change this.
#
keys:
  - &nixossone age1rc4zadqdx23e9gmlffekws290f652s2q8n28tneja56w9fn5zf9qln8nvt
  - &nixex age1g9cu47fdawa8y5jvty6u07ku6lcfy7c5r9jdjy43wvydqhe973aszrhej3
creation_rules:
  - path_regex: secrets\.yaml$
    key_groups:
      - age:
          - *nixossone
          - *nixex
